plugins {
    id 'com.android.library'
}

android {
    namespace 'com.yourname.myplugin'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'com.github.Aliucord:Aliucord:main-SNAPSHOT'
}
